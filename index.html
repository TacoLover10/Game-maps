<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Game Map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #map { position: absolute; inset: 0; }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #grid { position: absolute; inset: 0; pointer-events: none; display: none; }
  #grid span {
    position: absolute; font: 700 13px -apple-system, sans-serif; color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
  #grid .gt { top: calc(env(safe-area-inset-top, 0px) + 96px); transform: translateX(-50%); }
  #grid .gl { left: 6px; transform: translateY(-50%); }
  #badge {
    position: absolute; left: 10px; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 5;
    font: 600 12px -apple-system, sans-serif; color: #fff; background: rgba(0,0,0,.6);
    padding: 6px 10px; border-radius: 12px; max-width: 70%;
  }

  /* Menu button (three lines) and dropdown */
  #menubtn {
    position: absolute; left: 10px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 9;
    width: 46px; height: 46px; border-radius: 23px; border: none; background: rgba(20,20,20,.92);
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; padding: 0;
  }
  #menubtn span { display: block; width: 20px; height: 2.5px; border-radius: 2px; background: #fff; }
  #menu {
    display: none; position: absolute; left: 10px; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 9;
    min-width: 190px; background: rgba(20,20,20,.97); border-radius: 14px; padding: 6px;
    font: 14px -apple-system, sans-serif; color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  #menu.open { display: block; }
  #menu .mh { padding: 8px 12px 4px; color: #999; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  #themes button {
    display: block; width: 100%; text-align: left; background: none; border: none; color: #fff;
    font: 600 16px -apple-system, sans-serif; padding: 12px; border-radius: 10px;
  }
  #themes button.on { background: rgba(255,255,255,.14); }
  #themes button.on::after { content: "\2713"; float: right; color: #6ee7a0; }

  /* Search bar */
  #top { position: absolute; left: 64px; right: 56px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 7; }
  #q {
    width: 100%; box-sizing: border-box; font-size: 16px; padding: 13px 14px; border-radius: 24px;
    border: none; outline: none; background: rgba(20,20,20,.92); color: #fff;
    -webkit-appearance: none; appearance: none;
  }
  #q::placeholder { color: #aaa; }
  .sugs { font: 14px -apple-system, sans-serif; color: #fff; }
  #sugs { background: rgba(20,20,20,.95); border-radius: 12px; margin-top: 6px; overflow: hidden; }
  #sugs:empty { display: none; }
  .sugs > div { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.12); }
  .sugs > div:first-child { border-top: none; }
  .sugs .ss { color: #aaa; font-size: 12px; margin-top: 2px; }

  /* Place card (bottom) */
  #sheet {
    position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    z-index: 6; display: none;
    background: rgba(20,20,20,.94); color: #fff; border-radius: 16px; padding: 12px 14px;
    font: 14px -apple-system, sans-serif;
  }
  #sheet .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #sheet .t { font-weight: 700; font-size: 17px; }
  #sheet .s { color: #aaa; margin-top: 2px; }
  .x { background: none; border: none; color: #aaa; font-size: 18px; padding: 0 4px; }
  .primary {
    margin-top: 10px; width: 100%; padding: 12px; border: none; border-radius: 24px;
    background: #3b82f6; color: #fff; font: 700 16px -apple-system, sans-serif;
  }

  /* Directions: compact From/To card at the top, trip card at the bottom */
  #dtop {
    display: none; position: absolute; left: 10px; right: 56px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 7;
    background: rgba(20,20,20,.95); border-radius: 16px; padding: 8px 10px; gap: 8px; align-items: flex-start;
    font: 14px -apple-system, sans-serif; color: #fff;
  }
  #dback { background: none; border: none; color: #fff; font-size: 24px; padding: 6px 4px 0 0; }
  #dflds { flex: 1; min-width: 0; }
  .drow { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .drow input {
    flex: 1; min-width: 0; font-size: 16px; padding: 9px 10px; border-radius: 10px; border: none; outline: none;
    background: rgba(255,255,255,.12); color: #fff; -webkit-appearance: none; appearance: none;
  }
  .drow input::placeholder { color: #bbb; }
  .dot { width: 10px; height: 10px; border-radius: 5px; flex: none; }
  .dot.a { border: 3px solid #3b82f6; box-sizing: border-box; }
  .dot.b { background: #ef4444; }
  #dflds .sugs { background: rgba(255,255,255,.08); border-radius: 10px; margin: 2px 0 4px; }
  #dflds .sugs:empty { display: none; }

  #dsheet {
    display: none; position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    z-index: 6; background: rgba(20,20,20,.95); color: #fff; border-radius: 18px; padding: 12px 14px 14px;
    font: 14px -apple-system, sans-serif;
  }
  #modes { display: flex; gap: 8px; }
  #modes button {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 4px;
    border-radius: 20px; border: 1px solid rgba(255,255,255,.28); background: none; color: #fff;
    font: 600 14px -apple-system, sans-serif;
  }
  #modes button.on { background: #fff; color: #000; border-color: #fff; }
  #modes .mi { font-size: 17px; }
  #sum { margin-top: 10px; font-size: 22px; font-weight: 800; color: #6ee7a0; }
  #dbtns { display: flex; gap: 8px; margin-top: 10px; }
  #dbtns .primary { margin-top: 0; width: auto; flex: 1; background: #1e9e55; }
  #dsteps {
    padding: 12px 18px; border-radius: 24px; border: 1px solid rgba(255,255,255,.3); background: none; color: #fff;
    font: 600 15px -apple-system, sans-serif;
  }
  #steps { display: none; list-style: none; padding: 0; margin: 8px 0 0; }
  #steps.open { display: block; max-height: 34vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #steps li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.12); }
  #steps .ar { width: 22px; text-align: center; font-size: 18px; }
  #steps .tx { flex: 1; }
  #steps .ds { color: #aaa; white-space: nowrap; }

  body.dir #top, body.dir #menubtn, body.dir #menu, body.dir #badge, body.dir #sheet { display: none !important; }
  body.dir #dtop { display: flex; }
  body.dir #dsheet { display: block; }

  /* Navigation mode: banner at the top, trip bar at the bottom */
  #nav {
    display: none; position: absolute; left: 8px; right: 8px; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 8;
    background: #14683a; color: #fff; border-radius: 16px; padding: 12px 14px;
    font: 16px -apple-system, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  #navmain { display: flex; align-items: center; gap: 14px; }
  #navarrow { font-size: 46px; width: 58px; text-align: center; line-height: 1; }
  #navdist { font-size: 30px; font-weight: 800; line-height: 1.1; }
  #navtext { font-size: 17px; font-weight: 600; margin-top: 2px; }
  #navthen {
    display: none; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.3);
    font-size: 14px; opacity: .92;
  }
  #navbar {
    display: none; position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 8;
    background: rgba(20,20,20,.95); color: #fff; border-radius: 16px; padding: 10px 14px;
    align-items: center; gap: 10px; font: 14px -apple-system, sans-serif;
  }
  #navbar .tm { font-size: 22px; font-weight: 800; color: #6ee7a0; }
  #navbar .in { color: #bbb; font-size: 13px; margin-top: 2px; }
  #navbar button { font: 600 14px -apple-system, sans-serif; border: none; border-radius: 12px; padding: 10px 14px; color: #fff; }
  #mutebtn { background: rgba(255,255,255,.16); }
  #endbtn { background: #e53935; font-size: 15px; }
  #recenter {
    display: none; position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 8;
    background: #fff; color: #14683a; font: 700 14px -apple-system, sans-serif; padding: 10px 14px;
    border-radius: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  body.nav #top, body.nav #menubtn, body.nav #menu, body.nav #badge, body.nav #sheet,
  body.nav #dtop, body.nav #dsheet, body.nav #grid { display: none !important; }
  body.nav #nav { display: block !important; }
  body.nav #navbar { display: flex !important; }

  /* ---- RDR2 look for the panels: dark card, cream text, double-line title bar ---- */
  body.rdr2 #sheet, body.rdr2 #dtop, body.rdr2 #dsheet, body.rdr2 #navbar, body.rdr2 #nav {
    background: rgba(29,27,25,.97); color: #e9e1cc; border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(233,225,204,.35), 0 6px 18px rgba(0,0,0,.5);
    font-family: "Copperplate", "American Typewriter", Georgia, serif;
  }
  body.rdr2 #pname, body.rdr2 #dtop::before {
    display: block; text-align: center; text-transform: uppercase; letter-spacing: .06em;
    font: 700 19px "Copperplate", "American Typewriter", Georgia, serif; color: #f1ead6;
    padding: 7px 10px; border: 1px solid #d8cfb8; outline: 1px solid #d8cfb8; outline-offset: 3px; margin: 4px 4px 8px;
    background: #14120f;
  }
  body.rdr2 #dtop { flex-wrap: wrap; padding: 8px 10px 10px; }
  body.rdr2 #dtop::before { content: "Directions"; flex: 0 0 100%; box-sizing: border-box; order: -1; }
  body.rdr2 #sheet .row { display: block; }
  body.rdr2 #pclose { position: absolute; top: 6px; right: 8px; color: #e9e1cc; }
  body.rdr2 #psub, body.rdr2 #steps .ds, body.rdr2 #navbar .in { color: #a89f8a; }
  body.rdr2 .x, body.rdr2 #dback { color: #e9e1cc; }
  body.rdr2 .drow input { background: rgba(233,225,204,.1); color: #f1ead6; border-radius: 2px; border: 1px solid rgba(233,225,204,.3); }
  body.rdr2 .drow input::placeholder { color: #a89f8a; }
  body.rdr2 .dot.a { border-color: #e9e1cc; }
  body.rdr2 .dot.b { background: #b3342e; }
  body.rdr2 #sugs, body.rdr2 #dflds .sugs { background: rgba(29,27,25,.97); color: #e9e1cc; border-radius: 3px; border: 1px solid rgba(233,225,204,.3); }
  body.rdr2 .sugs .ss { color: #a89f8a; }
  body.rdr2 #q { background: rgba(29,27,25,.95); color: #f1ead6; border-radius: 3px; border: 1px solid rgba(233,225,204,.4); }
  body.rdr2 .primary { background: #3a3631; color: #f1ead6; border: 1px solid #d8cfb8; border-radius: 2px; font-family: inherit; letter-spacing: .05em; text-transform: uppercase; }
  body.rdr2 #dbtns .primary { background: #8a2b27; border-color: #e9e1cc; }
  body.rdr2 #dsteps, body.rdr2 #modes button { border-radius: 2px; border: 1px solid #d8cfb8; color: #e9e1cc; font-family: inherit; }
  body.rdr2 #modes button.on { background: #e9e1cc; color: #1d1b19; }
  body.rdr2 #sum, body.rdr2 #navbar .tm { color: #e6cf93; }
  body.rdr2 #steps li { border-top-color: rgba(233,225,204,.2); }
  body.rdr2 #nav { background: rgba(29,27,25,.97); border: 1px solid #d8cfb8; }
  body.rdr2 #navthen { border-top-color: rgba(233,225,204,.3); }
  body.rdr2 #endbtn { background: #8a2b27; border-radius: 2px; }
  body.rdr2 #mutebtn { background: rgba(233,225,204,.15); border-radius: 2px; }
  body.rdr2 #recenter { background: #e9e1cc; color: #1d1b19; border-radius: 2px; }
  /* On wide screens (iPad / landscape) the directions panel sits on the left side like the game's info card */
  @media (min-width: 700px) {
    body.rdr2 #dtop { left: 12px; right: auto; width: 340px; }
    body.rdr2 #dsheet { left: 12px; right: auto; width: 340px; bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 232px); }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="fx"></div>
<div id="grid"></div>

<button id="menubtn" aria-label="Menu"><span></span><span></span><span></span></button>
<div id="menu">
  <div class="mh">Map style</div>
  <div id="themes"></div>
</div>

<div id="top">
  <input id="q" type="search" placeholder="Search places or addresses" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="sugs" class="sugs"></div>
</div>

<div id="badge">loading...</div>

<div id="sheet">
  <div class="row">
    <div><div id="pname" class="t"></div><div id="psub" class="s"></div></div>
    <button id="pclose" class="x">&#10005;</button>
  </div>
  <button id="pdir" class="primary">Directions</button>
</div>

<div id="dtop">
  <button id="dback" aria-label="Back">&#8592;</button>
  <div id="dflds">
    <div class="drow"><i class="dot a"></i><input id="dfrom" placeholder="Your location" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div id="sf" class="sugs"></div>
    <div class="drow"><i class="dot b"></i><input id="dto" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div id="st" class="sugs"></div>
  </div>
</div>

<div id="dsheet">
  <div id="modes">
    <button data-m="car" class="on"><span class="mi">&#128663;</span><b id="t-car">&ndash;</b></button>
    <button data-m="foot"><span class="mi">&#128694;</span><b id="t-foot">&ndash;</b></button>
    <button data-m="bike"><span class="mi">&#128690;</span><b id="t-bike">&ndash;</b></button>
  </div>
  <div id="sum"></div>
  <div id="dbtns">
    <button id="dstart" class="primary" style="display:none">Start</button>
    <button id="dsteps">Steps</button>
  </div>
  <ol id="steps"></ol>
</div>

<div id="nav">
  <div id="navmain">
    <div id="navarrow"></div>
    <div><div id="navdist"></div><div id="navtext"></div></div>
  </div>
  <div id="navthen"></div>
</div>
<div id="recenter">Re-center</div>
<div id="navbar">
  <div><div class="tm" id="navtime"></div><div class="in" id="navinfo"></div></div>
  <span style="flex:1"></span>
  <button id="mutebtn">Voice on</button>
  <button id="endbtn">End</button>
</div>

<script>
window.addEventListener("error", e => {
  document.getElementById("badge").textContent = "JS error: " + e.message + " (" + String(e.filename || "").split("/").pop() + ":" + (e.lineno || "?") + ")";
});

// ---------- Place icons ----------
// subs = OpenStreetMap place types that get this icon. dim = grayed out in the RDR2 set.
const ICONS = [
  { key: "saloon", subs: ["bar", "pub", "biergarten", "nightclub"],
    g: `<rect x="19" y="16" width="5" height="11" rx="1"/><rect x="15" y="26" width="13" height="21" rx="4"/><rect x="18" y="33" width="7" height="8" rx="1" fill="BG"/><path d="M33 22h15l-2 13c-.5 3.2-2.6 5-5.5 5s-5-1.8-5.5-5z"/><rect x="39.2" y="39" width="3.6" height="6"/><rect x="35" y="44" width="12" height="3.5" rx="1.7"/>` },
  { key: "food", subs: ["restaurant", "fast_food", "food_court"],
    g: `<rect x="17" y="14" width="3.5" height="14"/><rect x="23" y="14" width="3.5" height="14"/><rect x="29" y="14" width="3.5" height="14"/><rect x="17" y="26" width="15.5" height="5" rx="2.5"/><rect x="23" y="29" width="3.5" height="21"/><path d="M45 14c-5 4-6.500 10-6.500 17h6v19h3.500V14z"/>` },
  { key: "cafe", subs: ["cafe", "bakery", "ice_cream", "confectionery", "coffee"],
    g: `<path d="M14 26h27v11a11 11 0 0 1-11 11h-5a11 11 0 0 1-11-11z"/><path d="M41 29h3.500a5 5 0 0 1 0 10H41" fill="none" stroke="white" stroke-width="3.500"/><rect x="19" y="14" width="3" height="8" rx="1.500"/><rect x="26" y="14" width="3" height="8" rx="1.500"/><rect x="33" y="14" width="3" height="8" rx="1.500"/>` },
  { key: "stable", subs: ["bicycle_rental", "bicycle"],
    g: `<g fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="40" r="7.500"/><circle cx="43" cy="40" r="7.500"/><path d="M21 40l8-14h9M29 26l6 14h8M38 26l5 14M26 21h7"/></g>` },
  { key: "bait", subs: ["aquarium", "fishing"],
    g: `<path d="M12 32c5-8 14-10 22-6l4 2 10-8v24l-10-8-4 2c-8 4-17 2-22-6z"/><circle cx="21" cy="29" r="2.200" fill="BG"/>` },
  { key: "photo", subs: ["photo", "camera", "photo_booth"],
    g: `<rect x="14" y="23" width="36" height="24" rx="5"/><path d="M24 23l3-6h10l3 6z"/><circle cx="32" cy="35" r="8" fill="BG"/><circle cx="32" cy="35" r="4.500"/><rect x="42" y="26" width="5" height="3" rx="1" fill="BG"/>` },
  { key: "transit", subs: ["station", "halt", "tram_stop", "subway", "subway_entrance", "ferry_terminal"],
    g: `<path d="M12 46V18h6l14 16 14-16h6v28h-7V31L32 46 19 31v15z"/>` },
  { key: "stagecoach", subs: ["bus_station"],
    g: `<rect x="16" y="14" width="32" height="30" rx="6"/><rect x="20" y="19" width="24" height="12" rx="2" fill="BG"/><rect x="31" y="19" width="2" height="12"/><circle cx="23" cy="37" r="2.400" fill="BG"/><circle cx="41" cy="37" r="2.400" fill="BG"/><rect x="20" y="43" width="6" height="6" rx="1"/><rect x="38" y="43" width="6" height="6" rx="1"/>` },
  { key: "tailor", subs: ["clothes", "tailor", "boutique"],
    g: `<path d="M23 14l-11 8 5 8 6-4v20h18V26l6 4 5-8-11-8c-1 4-4 6-8 6s-7-2-8-6z"/>` },
  { key: "doctor", subs: ["doctors", "doctor", "clinic", "hospital", "dentist", "pharmacy", "chemist"],
    g: `<g transform="translate(-4 3)"><g fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"><path d="M24 18v11a9 9 0 0 0 18 0V18"/><path d="M33 38v3a8 8 0 0 0 16 0v-4"/></g><circle cx="49" cy="32" r="5"/><circle cx="24" cy="16" r="2.800"/><circle cx="42" cy="16" r="2.800"/></g>` },
  { key: "hotel", subs: ["hotel", "motel", "hostel", "guest_house", "bed_and_breakfast"],
    g: `<rect x="14" y="20" width="5" height="26" rx="1"/><rect x="14" y="37" width="36" height="6" rx="1"/><rect x="24" y="29" width="26" height="7" rx="2"/><circle cx="23" cy="31" r="4.500"/>` },
  { key: "pawn", dim: true, subs: ["pawnbroker", "second_hand", "antiques", "jewelry"],
    g: `<path d="M16 22l4-6 4 6v26h-8zM28 22l4-6 4 6v26h-8zM40 22l4-6 4 6v26h-8z"/><rect x="12" y="28" width="40" height="4" fill="BG"/><rect x="12" y="38" width="40" height="4" fill="BG"/>` },
  { key: "barber", subs: ["hairdresser", "barber", "beauty"],
    g: `<g fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"><circle cx="21" cy="43" r="6"/><circle cx="43" cy="43" r="6"/><path d="M25 38l18-22M39 38L21 16"/></g>` },
  { key: "info", dim: true, subs: ["newsagent", "kiosk", "information"],
    g: `<circle cx="32" cy="18" r="5"/><rect x="27" y="27" width="10" height="22" rx="2"/>` },
  { key: "post", subs: ["post_office"],
    g: `<rect x="13" y="19" width="38" height="26" rx="3"/><path d="M13 22l19 14 19-14" fill="none" stroke="BG" stroke-width="3.500"/>` },
  { key: "theater", subs: ["theatre", "cinema", "arts_centre"],
    g: `<path d="M14 17h19v13a9.500 9.500 0 0 1-19 0z"/><path d="M31 27h19v13a9.500 9.500 0 0 1-19 0z" stroke="BG" stroke-width="2.500"/><circle cx="20" cy="25" r="2" fill="BG"/><circle cx="27" cy="25" r="2" fill="BG"/><path d="M19 32q4 4 9 0" fill="none" stroke="BG" stroke-width="2" stroke-linecap="round"/><circle cx="37" cy="35" r="2" fill="BG"/><circle cx="44" cy="35" r="2" fill="BG"/><path d="M37 44q4-4 9 0" fill="none" stroke="BG" stroke-width="2" stroke-linecap="round"/>` },
  { key: "general", subs: ["supermarket", "convenience", "general", "department_store", "greengrocer", "marketplace", "mall", "bank", "atm"],

function fetchJson(url, ms, opts) {

    .then(r => r.json())

// Resolves with the first promise that succeeds; rejects only if all of them fail
function firstOk(ps) {
  return new Promise((res, rej) => {
    let n = ps.length, last;
    ps.forEach(p => p.then(res, e => { last = e; if (--n === 0) rej(last); }));
  });

const PROFILES = { car: "routed-car", bike: "routed-bike", foot: "routed-foot" };
function fetchRoute(from, to, mode) {
  const coords = from[0] + "," + from[1] + ";" + to[0] + "," + to[1];
  const q = "?overview=full&geometries=geojson&steps=true";
  const urls = ["https://routing.openstreetmap.de/" + PROFILES[mode] + "/route/v1/driving/" + coords + q];
  if (mode === "car") urls.push("https://router.project-osrm.org/route/v1/driving/" + coords + q);
  return firstOk(urls.map(u => fetchJson(u, 12000).then(j => {
    if (j.code === "Ok" && j.routes && j.routes.length) return j.routes[0];
    throw new Error(j.message || j.code || "no route found");
  })));
}

function getRoute(from, to, mode) {
  const k = mode + ":" + from[0].toFixed(4) + "," + from[1].toFixed(4) + ">" + to[0].toFixed(5) + "," + to[1].toFixed(5);
  if (routeCache.has(k)) return routeCache.get(k);
  const p = fetchRoute(from, to, mode);
  routeCache.set(k, p);
  p.catch(() => routeCache.delete(k));
  return p;
}

    case "off ramp": text = "Take the exit" + road; break;
    case "fork": text = "Keep " + (mod || "straight") + " at the fork" + road; break;
    case "roundabout": case "rotary": text = "Enter the roundabout" + (m.exit ? ", take exit " + m.exit : "") + road; arrow = "\u21BB"; break;
    case "roundabout turn": text = "At the roundabout turn " + mod + road; break;
    case "continue": text = "Continue " + (mod || "straight") + on; break;
    default: text = "Continue" + road;
  }
  return { text, arrow };
}
function pretty(s) {
  s = String(s || "").replace(/_/g, " ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function getUserPos() {
  return new Promise((res, rej) => {
    if (userPos) return res(userPos);
    if (!navigator.geolocation) return rej(new Error("location not available"));
    navigator.geolocation.getCurrentPosition(
      p => { userPos = [p.coords.longitude, p.coords.latitude]; res(userPos); },
      () => rej(new Error("allow location access, or type a start point")),
      { enableHighAccuracy: true, timeout: 10000 });
  });
}

// ----- Live places for zoom 12 to 14 (the map tiles have none below zoom 14) -----
const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"];
let lowBox = null, lowTimer = null;
function loadLowPlaces() {
  const z = map.getZoom();
  if (z < 12 || z >= 14.5) return;
  const b = map.getBounds();
  if (lowBox && b.getWest() >= lowBox.w && b.getEast() <= lowBox.e &&
      b.getSouth() >= lowBox.s && b.getNorth() <= lowBox.n) return;
  const px = (b.getEast() - b.getWest()) * 0.4, py = (b.getNorth() - b.getSouth()) * 0.4;
  const box = { w: b.getWest() - px, e: b.getEast() + px, s: b.getSouth() - py, n: b.getNorth() + py };
  const bb = box.s + "," + box.w + "," + box.n + "," + box.e;
  const q = '[out:json][timeout:20];(' +
    'nwr["shop"~"^(mall|department_store|supermarket)$"]["name"](' + bb + ');' +
    'nwr["amenity"~"^(hospital|cinema|theatre|bus_station|marketplace)$"]["name"](' + bb + ');' +
    'nwr["tourism"~"^(hotel|aquarium)$"]["name"](' + bb + ');' +
    ');out center 250;';
  const body = "data=" + encodeURIComponent(q);
  firstOk(OVERPASS.map(u => fetchJson(u, 20000, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body
  }).then(j => { if (!j || !j.elements) throw new Error("bad response"); return j; })))
    .then(j => {
      const feats = [];
      j.elements.forEach(el => {
        const lon = el.lon != null ? el.lon : (el.center && el.center.lon);
        const lat = el.lat != null ? el.lat : (el.center && el.center.lat);
        const tags = el.tags || {};
        if (lat == null || lon == null || !tags.name) return;
        feats.push({ type: "Feature", geometry: { type: "Point", coordinates: [lon, lat] },
          properties: { name: tags.name, icon: iconFor(tags), kind: tags.shop || tags.amenity || tags.tourism || "" } });
      });
      LOW_FC = { type: "FeatureCollection", features: feats };
      const s = map.getSource("lowpois"); if (s) s.setData(LOW_FC);
      lowBox = box;
    })
    .catch(() => {});
}
map.on("moveend", () => { clearTimeout(lowTimer); lowTimer = setTimeout(loadLowPlaces, 250); });
map.on("load", loadLowPlaces);

// Badge: zoom level, places on screen, and any map error
function updateBadge() {
  const z = map.getZoom();
  let n = 0;

}

// ----- Search (free OpenStreetMap-based place search) -----
function attachSearch(input, list, onPick) {
  let timer = null, ctrl = null;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const v = input.value.trim();
    if (v.length < 2) { list.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      if (ctrl) ctrl.abort();
      ctrl = new AbortController();
      try {
        const c = map.getCenter();
        const url = "https://photon.komoot.io/api/?limit=6&lat=" + c.lat + "&lon=" + c.lng + "&q=" + encodeURIComponent(v);
        const r = await fetch(url, { signal: ctrl.signal });
        const j = await r.json();
        list.innerHTML = "";
        (j.features || []).forEach(f => {
          const p = f.properties || {};
          const street = [p.housenumber, p.street].filter(Boolean).join(" ");
          const title = p.name || street || p.city || "Unnamed place";
          const sub = [(p.name && street) ? street : "", p.city, p.state, p.country].filter(Boolean).join(", ");
          const d = document.createElement("div");
          const a = document.createElement("b"); a.textContent = title;
          const b = document.createElement("div"); b.className = "ss"; b.textContent = sub;
          d.appendChild(a); d.appendChild(b);
          d.onclick = () => { list.innerHTML = ""; input.value = title; input.blur();
            onPick({ name: title, sub: sub, lngLat: f.geometry.coordinates }); };
          list.appendChild(d);
        });
        if (!list.children.length) list.textContent = "No results";
      } catch (e) { if (e.name !== "AbortError") list.textContent = "Search unavailable right now"; }
    }, 200);
  });
}

// ----- Place card and directions -----
const sheet = $("sheet");
const dfrom = $("dfrom"), dto = $("dto"), sum = $("sum"), stepsEl = $("steps");
let cand = null, dest = null, from = null, mode = "car", dirOpen = false, routeToken = 0, curRoute = null;
const MODES = ["car", "foot", "bike"];

function setDirUI(on) { document.body.classList.toggle("dir", on); }
function setPin(ll) {
  PIN_FC = ll ? { type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: ll } }] } : EMPTY_FC;
  const s = map.getSource("pin"); if (s) s.setData(PIN_FC);
}
function setRoute(geom) {
  ROUTE_FC = geom ? { type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: geom }] } : EMPTY_FC;
  const s = map.getSource("route"); if (s) s.setData(ROUTE_FC);
}
function fitCoords(coords) {
  const b = new maplibregl.LngLatBounds();
  coords.forEach(c => b.extend(c));
  const top = Math.round(Math.min(190, window.innerHeight * 0.26));
  const bottom = Math.round(Math.min(270, window.innerHeight * 0.36));
  map.fitBounds(b, { padding: { top: top, bottom: bottom, left: 40, right: 40 }, maxZoom: 17, duration: 600 });
}
function setChip(m, r) { $("t-" + m).textContent = r ? fmtDur(r.duration) : "\u2013"; }

function showPlace(p, fly) {
  cand = p; dirOpen = false; routeToken++;
  setDirUI(false);
  $("pname").textContent = p.name;
  $("psub").textContent = p.sub || "";
  setPin(p.lngLat); setRoute(null);
  if (fly) map.flyTo({ center: p.lngLat, zoom: Math.max(map.getZoom(), 16) });
  sheet.style.display = "block";
  // Start working out the driving route now so Directions opens instantly
  if (userPos) getRoute(userPos, p.lngLat, "car").catch(() => {});
}
function hideSheet() {
  routeToken++;
  setDirUI(false);
  sheet.style.display = "none";
  dirOpen = false; setPin(null); setRoute(null);
}

// Fill in the travel times for the other modes, one at a time so the free routing servers are not hammered
async function fillOthers(start, token) {
  for (const m of MODES) {
    if (m === mode) continue;
    await new Promise(r => setTimeout(r, 500));
    if (token !== routeToken) return;
    try {
      const r = await getRoute(start, dest.lngLat, m);
      if (token === routeToken) setChip(m, r);
    } catch (e) {}
  }
}

async function computeRoute(fresh) {
  if (!dest) return;
  const token = ++routeToken;
  if (fresh) MODES.forEach(m => setChip(m, null));
  sum.textContent = "Finding route...";
  stepsEl.innerHTML = "";
  $("dstart").style.display = "none";
  curRoute = null;
  setRoute(null);
  try {
    const start = from ? from.lngLat : await getUserPos();
    if (token !== routeToken) return;
    // Instant straight-line preview while the real route loads
    setRoute({ type: "LineString", coordinates: [start, dest.lngLat] });
    fitCoords([start, dest.lngLat]);
    const r = await getRoute(start, dest.lngLat, mode);
    if (token !== routeToken) return;
    curRoute = r;
    setRoute(r.geometry);
    fitCoords(r.geometry.coordinates);
    setChip(mode, r);
    sum.textContent = fmtDur(r.duration) + " \u00B7 " + fmtDist(r.distance);
    // Navigation follows your GPS, so Start only shows when the route begins at your location
    $("dstart").style.display = from ? "none" : "";
    (r.legs || []).forEach(leg => (leg.steps || []).forEach(s => {
      const info = stepInfo(s);
      const li = document.createElement("li");
      const ar = document.createElement("span"); ar.className = "ar"; ar.textContent = info.arrow;
      const tx = document.createElement("span"); tx.className = "tx"; tx.textContent = info.text;
      const ds = document.createElement("span"); ds.className = "ds";
      ds.textContent = (s.maneuver && s.maneuver.type === "arrive") ? "" : fmtDist(s.distance);
      li.appendChild(ar); li.appendChild(tx); li.appendChild(ds);
      li.onclick = () => { if (s.maneuver && s.maneuver.location) map.flyTo({ center: s.maneuver.location, zoom: 17 }); };
      stepsEl.appendChild(li);
    }));
    fillOthers(start, token);
  } catch (e) {
    if (token === routeToken) { setRoute(null); sum.textContent = "Couldn't get directions: " + (e.message || "try again"); }
  }
}

function openDirections() {
  dest = cand; from = null; dirOpen = true;
  dfrom.value = ""; dto.value = cand.name;
  stepsEl.classList.remove("open"); $("dsteps").textContent = "Steps";
  setDirUI(true);
  computeRoute(true);
}

// ----- Turn-by-turn navigation -----
let navOn = false, follow = true, navWatch = null, navMarker = null, wakeLock = null, muted = false;
let routeCoords = [], routeCum = [], routeScale = 1, navSteps = [], navSeg = 0, navTotal = 0;
let said = {}, offCount = 0, rerouting = false, lastReroute = 0, arrived = false, lastHeading = 0;
const PAD_ON = { top: 220, bottom: 0, left: 0, right: 0 };
const PAD_OFF = { top: 0, bottom: 0, left: 0, right: 0 };

function bearingOf(a, b) {
  const r = Math.PI / 180, dl = (b[0] - a[0]) * r;
  const y = Math.sin(dl) * Math.cos(b[1] * r);
  const x = Math.cos(a[1] * r) * Math.sin(b[1] * r) - Math.sin(a[1] * r) * Math.cos(b[1] * r) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
}
function spokenDist(m) {
  const ft = m * 3.281;
  if (ft < 1000) return Math.max(50, Math.round(ft / 50) * 50) + " feet";
  const mi = m / 1609.344;
  return (mi < 10 ? mi.toFixed(1) : Math.round(mi)) + " miles";
}
function lc(s) { return s.charAt(0).toLowerCase() + s.slice(1); }
function speak(t) {
  if (muted || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.rate = 1.02;
    speechSynthesis.speak(u);
  } catch (e) {}
}
async function lockScreen() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
function unlockScreen() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener("visibilitychange", () => { if (navOn && document.visibilityState === "visible") lockScreen(); });

// Prepare a route for tracking: cumulative distance along the line, and where each step starts
function buildNav(r) {
  routeCoords = r.geometry.coordinates;
  routeCum = [0];
  let tot = 0;
  for (let i = 0; i < routeCoords.length - 1; i++) {
    const a = routeCoords[i], b = routeCoords[i + 1];
    const kx = Math.cos((a[1] + b[1]) / 2 * Math.PI / 180) * 111320;
    tot += Math.hypot((b[0] - a[0]) * kx, (b[1] - a[1]) * 110540);
    routeCum.push(tot);
  }
  routeScale = tot ? r.distance / tot : 1;
  navTotal = r.distance;
  navSeg = 0; said = {}; arrived = false;
  navSteps = [];
  let acc = 0;
  (r.legs || []).forEach(leg => (leg.steps || []).forEach(s => {
    navSteps.push({ s: s, info: stepInfo(s), start: acc });
    acc += s.distance;
  }));
}
// Closest point on the route to where you are: distance along the route, and how far off it you are
function project(ll) {
  const kx = Math.cos(ll[1] * Math.PI / 180) * 111320, ky = 110540;
  let best = { off: Infinity, along: 0, idx: navSeg };
  const first = Math.max(0, navSeg - 3);
  for (let i = first; i < routeCoords.length - 1; i++) {
    const a = routeCoords[i], b = routeCoords[i + 1];
    const ax = (a[0] - ll[0]) * kx, ay = (a[1] - ll[1]) * ky;
    const dx = (b[0] - a[0]) * kx, dy = (b[1] - a[1]) * ky;
    const len2 = dx * dx + dy * dy;
    const t = len2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2)) : 0;
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < best.off) best = { off: d, along: (routeCum[i] + t * Math.sqrt(len2)) * routeScale, idx: i };
    if (best.off < 60 && routeCum[i] - routeCum[first] > 2500) break;
  }
  return best;
}

function updateNav(along) {
  const rem = Math.max(0, navTotal - along);
  let i = 0;
  while (i + 1 < navSteps.length && navSteps[i + 1].start <= along + 3) i++;
  const nxt = navSteps[i + 1] || navSteps[i];
  const toNext = Math.max(0, (navSteps[i + 1] ? navSteps[i + 1].start : navTotal) - along);
  if (nxt) {
    $("navarrow").textContent = nxt.info.arrow;
    $("navdist").textContent = fmtDist(toNext);
    $("navtext").textContent = nxt.info.text;
    // "Then ..." line when the following maneuver is close
    const th = navSteps[i + 2];
    if (navSteps[i + 1] && th && (th.start - nxt.start) < 300) {
      $("navthen").style.display = "block";
      $("navthen").textContent = "Then " + th.info.arrow + "  " + th.info.text;
    } else $("navthen").style.display = "none";
    // Voice prompts
    const idx = i + 1;
    if (navSteps[idx]) {
      const far = (navSteps[idx].start - navSteps[i].start) > 800;
      if (!said[idx + "n"] && toNext <= 120) {
        said[idx + "n"] = 1; said[idx + "f"] = 1;
        speak("In " + spokenDist(toNext) + ", " + lc(nxt.info.text));
      } else if (far && !said[idx + "f"] && toNext <= 500) {
        said[idx + "f"] = 1;
        speak("In " + spokenDist(toNext) + ", " + lc(nxt.info.text));
      }
    }
  }
  const remSec = curRoute ? curRoute.duration * (navTotal ? rem / navTotal : 0) : 0;
  $("navtime").textContent = fmtDur(remSec);
  const eta = new Date(Date.now() + remSec * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  $("navinfo").textContent = fmtDist(rem) + " \u00B7 arrive " + eta;
  if (rem < 25 && !arrived) {
    arrived = true;
    $("navarrow").textContent = "\u2691";
    $("navdist").textContent = "";
    $("navtext").textContent = "You have arrived";
    $("navthen").style.display = "none";
    speak("You have arrived");
    setTimeout(() => { if (navOn) endNav(); }, 6000);
  }
}

async function reroute(ll) {
  if (rerouting || Date.now() - lastReroute < 12000 || !dest) return;
  rerouting = true; lastReroute = Date.now();
  $("navtext").textContent = "Rerouting...";
  speak("Rerouting");
  try {
    const r = await fetchRoute(ll, dest.lngLat, mode);
    if (!navOn) return;
    curRoute = r; setRoute(r.geometry); buildNav(r); offCount = 0;
  } catch (e) {} finally { rerouting = false; }
}

function onPos(pos) {
  if (!navOn) return;
  const ll = [pos.coords.longitude, pos.coords.latitude];
  userPos = ll;
  let hd = pos.coords.heading;
  const moving = pos.coords.speed == null || pos.coords.speed > 1;
  if (hd != null && !isNaN(hd) && moving) lastHeading = hd;
  if (navMarker) { navMarker.setLngLat(ll); navMarker.setRotation(lastHeading); }
  const pr = project(ll);
  if (pr.off > 60) { if (++offCount >= 3) reroute(ll); }
  else { offCount = 0; navSeg = pr.idx; }
  if (!rerouting) updateNav(pr.along);
  if (follow) map.easeTo({ center: ll, bearing: lastHeading, padding: PAD_ON, duration: 900, easing: t => t });
}

function startNav() {
  if (!curRoute || from) return;
  navOn = true; follow = true;
  buildNav(curRoute);
  document.body.classList.add("nav");
  // iPhones only allow speech after a tap, so unlock it here
  try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (e) {}
  lockScreen();
  try { map.removeControl(geo); } catch (e) {}
  const el = document.createElement("div");
  el.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24"><path d="M12 2l8 20-8-5-8 5z" fill="#3b82f6" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
  const here = userPos || routeCoords[0];
  lastHeading = routeCoords.length > 1 ? bearingOf(routeCoords[0], routeCoords[Math.min(3, routeCoords.length - 1)]) : 0;
  navMarker = new maplibregl.Marker({ element: el, rotationAlignment: "map", pitchAlignment: "map", rotation: lastHeading })
    .setLngLat(here).addTo(map);
  map.easeTo({ center: here, zoom: 17, pitch: 55, bearing: lastHeading, padding: PAD_ON, duration: 1000 });
  updateNav(0);
  if (navSteps[0]) speak(navSteps[0].info.text);
  navWatch = navigator.geolocation.watchPosition(onPos,
    () => { $("navtext").textContent = "Waiting for GPS..."; },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}

function endNav() {
  navOn = false;
  if (navWatch != null) navigator.geolocation.clearWatch(navWatch);
  navWatch = null;
  if (navMarker) navMarker.remove();
  navMarker = null;
  try { speechSynthesis.cancel(); } catch (e) {}
  unlockScreen();
  document.body.classList.remove("nav");
  $("recenter").style.display = "none";
  map.easeTo({ pitch: 0, bearing: 0, padding: PAD_OFF, duration: 600 });
  mountGeo();
  setTimeout(() => { try { geo.trigger(); } catch (e) {} }, 400);
}

$("dstart").onclick = startNav;
$("endbtn").onclick = endNav;
$("mutebtn").onclick = () => {
  muted = !muted;
  $("mutebtn").textContent = muted ? "Voice off" : "Voice on";
  if (muted) { try { speechSynthesis.cancel(); } catch (e) {} }
};
$("recenter").onclick = () => {
  follow = true;
  $("recenter").style.display = "none";
  if (userPos) map.easeTo({ center: userPos, bearing: lastHeading, zoom: 17, pitch: 55, padding: PAD_ON, duration: 600 });
};
// Dragging the map stops it following you until you tap Re-center
map.on("dragstart", e => {
  if (navOn && e.originalEvent) { follow = false; $("recenter").style.display = "block"; }
});

$("pdir").onclick = openDirections;
$("pclose").onclick = hideSheet;
$("dback").onclick = () => { if (dest) showPlace(dest, false); else hideSheet(); };
$("dsteps").onclick = () => {
  const open = stepsEl.classList.toggle("open");
  $("dsteps").textContent = open ? "Hide steps" : "Steps";
};
[...document.querySelectorAll("#modes button")].forEach(b => {
  b.onclick = () => {
    mode = b.dataset.m;
    [...document.querySelectorAll("#modes button")].forEach(x => x.classList.toggle("on", x === b));
    computeRoute(false);
  };
});

attachSearch($("q"), $("sugs"), p => showPlace(p, true));
attachSearch(dfrom, $("sf"), p => { from = p; computeRoute(true); });
attachSearch(dto, $("st"), p => { dest = p; cand = p; setPin(p.lngLat); computeRoute(true); });
dfrom.addEventListener("input", () => { if (!dfrom.value.trim()) { from = null; $("sf").innerHTML = ""; } });
dfrom.addEventListener("change", () => { if (!dfrom.value.trim()) { from = null; computeRoute(true); } });

// ----- Menu (three lines, top left) -----
const menu = $("menu");
$("menubtn").onclick = e => { e.stopPropagation(); menu.classList.toggle("open"); };
document.addEventListener("click", e => {
  if (!menu.contains(e.target) && e.target !== $("menubtn") && !$("menubtn").contains(e.target)) menu.classList.remove("open");
});

// Tap a place icon or any spot on the map to get a place card
map.on("click", e => {
  if (menu.classList.contains("open")) return;
  if (dirOpen || navOn) return;
  let fs = [];
  try {
    const ls = ["poi", "lowpoi"].filter(id => map.getLayer(id));
    if (ls.length) {
      const box = [[e.point.x - 14, e.point.y - 14], [e.point.x + 14, e.point.y + 14]];
      fs = map.queryRenderedFeatures(box, { layers: ls });
    }
  } catch (err) {}
  if (fs.length) {
    const f = fs[0], p = f.properties || {};
    const kind = p.subclass || p.kind;
    showPlace({ name: p.name || pretty(kind), sub: pretty(kind), lngLat: f.geometry.coordinates }, false);
  } else {
    const ll = [e.lngLat.lng, e.lngLat.lat];
    showPlace({ name: "Dropped pin", sub: ll[1].toFixed(5) + ", " + ll[0].toFixed(5), lngLat: ll }, false);
  }
});

// Fortnite-style grid labels: letters A-H across the top, numbers 1-8 down the left
const gridEl = $("grid");
"ABCDEFGH".split("").forEach((c, i) => {
  const s = document.createElement("span");
  s.className = "gt"; s.textContent = c; s.style.left = (i * 12.5 + 6.25) + "%";
  gridEl.appendChild(s);
});
for (let n = 1; n <= 8; n++) {
  const s = document.createElement("span");
  s.className = "gl"; s.textContent = n; s.style.top = ((n - 1) * 12.5 + 6.25) + "%";
  gridEl.appendChild(s);
}

// ----- Themes (listed in the menu) -----
const bar = $("themes");
const fx = $("fx");
function applyThemeUI(key) {
  const t = THEMES[key];
  fx.style.background = t.fx;
  document.body.classList.toggle("rdr2", t.kind === "rdr2");
  gridEl.style.display = t.grid ? "block" : "none";
  [...bar.children].forEach(b => b.classList.toggle("on", b.dataset.k === key));
}
function setTheme(key) {
  const t = THEMES[key];
  applyThemeUI(key);
  // Make sure this theme's icons exist before the style switches (instant after the first load)
  ensureVariant(t.iconSuffix || "").then(() => {
    curTheme = t;
    // diff:false = replace the whole style, so switching themes can't half-fail
    map.setStyle(makeStyle(t), { diff: false });
  });
}
Object.entries(THEMES).forEach(([k, t]) => {
  const b = document.createElement("button");
  b.textContent = t.label; b.dataset.k = k;
  b.onclick = () => { setTheme(k); menu.classList.remove("open"); };
  bar.appendChild(b);
});
applyThemeUI("rdr2");
</script>
</body>
</html>
