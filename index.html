<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Game Map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #map { position: absolute; inset: 0; }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #grid { position: absolute; inset: 0; pointer-events: none; display: none; }
  #grid span {
    position: absolute; font: 700 13px -apple-system, sans-serif; color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
  #grid .gt { top: calc(env(safe-area-inset-top, 0px) + 90px); transform: translateX(-50%); }
  #grid .gl { left: 6px; transform: translateY(-50%); }
  #themes {
    position: absolute; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px);
    display: flex; gap: 8px; justify-content: center; padding: 12px; z-index: 5;
  }
  #themes button {
    font: 600 14px -apple-system, sans-serif; padding: 10px 16px; border-radius: 20px;
    border: 2px solid #fff; background: rgba(0,0,0,.65); color: #fff;
  }
  #themes button.on { background: #fff; color: #000; }
  #badge {
    position: absolute; left: 10px; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 5;
    font: 600 12px -apple-system, sans-serif; color: #fff; background: rgba(0,0,0,.6);
    padding: 6px 10px; border-radius: 12px; max-width: 70%;
  }

  /* Search bar */
  #top { position: absolute; left: 10px; right: 56px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 7; }
  #q {
    width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px 14px; border-radius: 24px;
    border: none; outline: none; background: rgba(20,20,20,.92); color: #fff;
    -webkit-appearance: none; appearance: none;
  }
  #q::placeholder { color: #aaa; }
  .sugs { font: 14px -apple-system, sans-serif; color: #fff; }
  #sugs { background: rgba(20,20,20,.95); border-radius: 12px; margin-top: 6px; overflow: hidden; }
  #sugs:empty { display: none; }
  .sugs > div { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.12); }
  .sugs > div:first-child { border-top: none; }
  .sugs .ss { color: #aaa; font-size: 12px; margin-top: 2px; }

  /* Bottom sheet (place card and directions) */
  #sheet {
    position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 62px);
    max-height: 52%; overflow-y: auto; z-index: 6; display: none;
    background: rgba(20,20,20,.94); color: #fff; border-radius: 16px; padding: 12px 14px;
    font: 14px -apple-system, sans-serif; -webkit-overflow-scrolling: touch;
  }
  #sheet .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #sheet .t { font-weight: 700; font-size: 17px; }
  #sheet .s { color: #aaa; margin-top: 2px; }
  #sheet button { font: 600 14px -apple-system, sans-serif; }
  .x { background: none; border: none; color: #aaa; font-size: 18px; padding: 0 4px; }
  .primary { margin-top: 10px; width: 100%; padding: 12px; border: none; border-radius: 12px; background: #3b82f6; color: #fff; }
  .fld { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .fld span { width: 38px; color: #aaa; }
  .fld input {
    flex: 1; min-width: 0; font-size: 16px; padding: 9px 10px; border-radius: 10px; border: none; outline: none;
    background: rgba(255,255,255,.12); color: #fff; -webkit-appearance: none; appearance: none;
  }
  .fld input::placeholder { color: #bbb; }
  #dir .sugs { background: rgba(255,255,255,.08); border-radius: 10px; margin-top: 4px; }
  #dir .sugs:empty { display: none; }
  #modes { display: flex; gap: 8px; margin-top: 10px; }
  #modes button { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3); background: none; color: #fff; }
  #modes button.on { background: #fff; color: #000; }
  #sum { margin-top: 10px; font-weight: 700; font-size: 16px; }
  #steps { list-style: none; padding: 0; margin: 6px 0 0; }
  #steps li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.12); }
  #steps .ar { width: 22px; text-align: center; font-size: 18px; }
  #steps .tx { flex: 1; }
  #steps .ds { color: #aaa; white-space: nowrap; }
</style>
</head>
<body>
<div id="map"></div>
<div id="fx"></div>
<div id="grid"></div>

<div id="top">
  <input id="q" type="search" placeholder="Search places or addresses" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="sugs" class="sugs"></div>
</div>

<div id="badge">loading...</div>

<div id="sheet">
  <div id="place" style="display:none">
    <div class="row">
      <div><div id="pname" class="t"></div><div id="psub" class="s"></div></div>
      <button id="pclose" class="x">&#10005;</button>
    </div>
    <button id="pdir" class="primary">Directions</button>
  </div>
  <div id="dir" style="display:none">
    <div class="row"><b>Directions</b><button id="dclose" class="x">&#10005;</button></div>
    <div class="fld"><span>From</span><input id="dfrom" placeholder="Your location" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div id="sf" class="sugs"></div>
    <div class="fld"><span>To</span><input id="dto" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div id="st" class="sugs"></div>
    <div id="modes">
      <button data-m="car" class="on">Drive</button>
      <button data-m="foot">Walk</button>
      <button data-m="bike">Bike</button>
    </div>
    <div id="sum"></div>
    <ol id="steps"></ol>
  </div>
</div>

<div id="themes"></div>

<script>
window.addEventListener("error", e => { document.getElementById("badge").textContent = "JS error: " + e.message; });

// ---------- Place icons ----------
// subs = OpenStreetMap place types that get this icon. dim = grayed out in the RDR2 set.
const ICONS = [
  { key: "saloon", subs: ["bar", "pub", "biergarten", "nightclub"],
    g: `<rect x="21" y="26" width="9" height="20" rx="3"/><rect x="24" y="17" width="4" height="10"/><path d="M34 24h12l-3 14h-6z"/><rect x="38" y="38" width="2" height="8"/><rect x="35" y="45" width="8" height="2"/>` },
  { key: "food", subs: ["restaurant", "fast_food", "food_court"],
    g: `<rect x="21" y="18" width="3" height="12"/><rect x="26" y="18" width="3" height="12"/><rect x="31" y="18" width="3" height="12"/><rect x="21" y="28" width="13" height="4" rx="2"/><rect x="26" y="30" width="3" height="16"/><path d="M42 18c-4 3-5 8-5 13h5v15h3V18z"/>` },
  { key: "cafe", subs: ["cafe", "bakery", "ice_cream", "confectionery", "coffee"],
    g: `<path d="M18 26h22v10a9 9 0 0 1-9 9h-4a9 9 0 0 1-9-9z"/><path d="M40 29h3a4 4 0 0 1 0 8h-3" fill="none" stroke="white" stroke-width="3"/><rect x="21" y="17" width="2.5" height="6"/><rect x="28" y="17" width="2.5" height="6"/><rect x="35" y="17" width="2.5" height="6"/>` },
  { key: "stable", subs: ["bicycle_rental", "bicycle"],
    g: `<g fill="none" stroke="white" stroke-width="3"><circle cx="23" cy="38" r="7"/><circle cx="41" cy="38" r="7"/><path d="M23 38l7-12h8l3 12M30 26l5 12"/></g>` },
  { key: "bait", subs: ["aquarium", "fishing"],
    g: `<ellipse cx="29" cy="32" rx="12" ry="8"/><path d="M39 32l10-8v16z"/><circle cx="24" cy="30" r="2" fill="BG"/>` },
  { key: "photo", subs: ["photo", "camera", "photo_booth"],
    g: `<rect x="17" y="24" width="30" height="20" rx="4"/><rect x="25" y="20" width="10" height="6" rx="2"/><circle cx="32" cy="34" r="6" fill="BG"/><circle cx="32" cy="34" r="3"/>` },
  { key: "stagecoach", subs: ["bus_station"],
    g: `<rect x="19" y="18" width="26" height="24" rx="5"/><rect x="23" y="22" width="18" height="8" fill="BG"/><circle cx="25" cy="36" r="2" fill="BG"/><circle cx="39" cy="36" r="2" fill="BG"/><rect x="22" y="42" width="4" height="4"/><rect x="38" y="42" width="4" height="4"/>` },
  { key: "tailor", subs: ["clothes", "tailor", "boutique"],
    g: `<path d="M24 18l-9 7 4 6 5-3v19h16V28l5 3 4-6-9-7c-1 3-4 5-8 5s-7-2-8-5z"/>` },
  { key: "doctor", subs: ["doctors", "doctor", "clinic", "hospital", "dentist", "pharmacy", "chemist"],
    g: `<g fill="none" stroke="white" stroke-width="3"><path d="M22 18v10a8 8 0 0 0 16 0V18"/><path d="M30 36v4a7 7 0 0 0 14 0v-5"/></g><circle cx="44" cy="31" r="4"/>` },
  { key: "hotel", subs: ["hotel", "motel", "hostel", "guest_house", "bed_and_breakfast"],
    g: `<rect x="16" y="22" width="4" height="22"/><rect x="16" y="36" width="32" height="5"/><rect x="22" y="29" width="26" height="7" rx="2"/><circle cx="26" cy="25" r="3.5"/>` },
  { key: "pawn", dim: true, subs: ["pawnbroker", "second_hand", "antiques", "jewelry"],
    g: `<path d="M20 25l3-5 3 5v20h-6zM29 25l3-5 3 5v20h-6zM38 25l3-5 3 5v20h-6z"/><rect x="18" y="29" width="28" height="3" fill="BG"/><rect x="18" y="38" width="28" height="3" fill="BG"/>` },
  { key: "barber", subs: ["hairdresser", "barber", "beauty"],
    g: `<g fill="none" stroke="white" stroke-width="3"><circle cx="23" cy="41" r="5"/><circle cx="41" cy="41" r="5"/><path d="M26 37l16-19M38 37L22 18"/></g>` },
  { key: "info", dim: true, subs: ["newsagent", "kiosk", "information"],
    g: `<circle cx="32" cy="21" r="4"/><rect x="28" y="28" width="8" height="18" rx="1.5"/>` },
  { key: "post", subs: ["post_office"],
    g: `<rect x="17" y="22" width="30" height="20" rx="2"/><path d="M17 24l15 11 15-11" fill="none" stroke="BG" stroke-width="3"/>` },
  { key: "theater", subs: ["theatre", "cinema", "arts_centre"],
    g: `<path d="M17 20h16v12a8 8 0 0 1-16 0z"/><path d="M31 28h16v12a8 8 0 0 1-16 0z" stroke="BG" stroke-width="2"/><circle cx="22" cy="26" r="1.8" fill="BG"/><circle cx="28" cy="26" r="1.8" fill="BG"/><circle cx="36" cy="34" r="1.8" fill="BG"/><circle cx="42" cy="34" r="1.8" fill="BG"/>` },
  { key: "general", subs: ["supermarket", "convenience", "general", "department_store", "greengrocer", "marketplace", "mall", "bank", "atm"],
    g: `<path d="M19 28h26l-3 17H22z"/><path d="M25 28a7 9 0 0 1 14 0" fill="none" stroke="white" stroke-width="3"/>` },
  { key: "butcher", subs: ["butcher"],
    g: `<rect x="16" y="26" width="25" height="12" rx="4"/><rect x="37" y="21" width="10" height="11" rx="3"/><rect x="19" y="36" width="3" height="10"/><rect x="34" y="36" width="3" height="10"/><rect x="38" y="18" width="2" height="4"/><rect x="44" y="18" width="2" height="4"/>` },
  { key: "trapper", subs: ["fabric", "sewing", "outdoor"],
    g: `<ellipse cx="32" cy="39" rx="9" ry="7"/><circle cx="21" cy="30" r="3.5"/><circle cx="28" cy="23" r="3.5"/><circle cx="36" cy="23" r="3.5"/><circle cx="43" cy="30" r="3.5"/>` },
  { key: "gun", subs: ["weapons"],
    g: `<rect x="12" y="22" width="34" height="9" rx="1.5"/><path d="M21 30h10l-3 17h-9z"/>` }
];

// Three looks for the icons:
//   ""    = black circle with white glyph (RDR2)
//   "-g"  = flat colored glyphs, no circle (GTA)
//   "-f"  = colored circle badge with white glyph (Fortnite, generic map icons)
const VARIANTS = [{ s: "" }, { s: "-g" }, { s: "-f" }];

const GTA_COL = {
  saloon: "#e23b3f", food: "#ffffff", cafe: "#ffffff", stable: "#9be8a8", bait: "#7fd0ff",
  photo: "#ffffff", stagecoach: "#ffffff", tailor: "#f5e04a", doctor: "#ff7a7a", hotel: "#7fd0ff",
  pawn: "#bdbdbd", barber: "#ffffff", info: "#bdbdbd", post: "#ffffff", theater: "#ffffff",
  general: "#d8f0d8", butcher: "#ff7a7a", trapper: "#f5e04a", gun: "#e23b3f"
};
const GTA_G = {
  saloon: { col: "#e23b3f",
    g: `<path d="M12 33c5-8 11-9 20-5 9-4 15-3 20 5-5 4-11 6-20 6S17 37 12 33z"/><path d="M14 36c4 7 10 10 18 10s14-3 18-10c-5 3-11 4-18 4s-13-1-18-4z"/>` },
  general: { col: "#d8f0d8",
    g: `<path d="M32 12L12 30h6v20h28V30h6z"/><text x="32" y="46" font-size="22" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#1f8a3e">$</text>` },
  stagecoach: { col: "#ffffff",
    g: `<path d="M10 38l5-12c1-3 3-4 6-4h22c3 0 5 1 6 4l5 12v9h-6v-4H16v4h-6z"/><rect x="19" y="27" width="26" height="8" rx="2" fill="BG"/>` }
};
const FORT_COL = {
  saloon: "#8a4fc0", food: "#f08a24", cafe: "#9c6b3f", stable: "#35557a", bait: "#6b7886",
  photo: "#d9559b", stagecoach: "#35557a", tailor: "#2f80d8", doctor: "#e04848", hotel: "#1fa7a0",
  pawn: "#2f80d8", barber: "#6b7886", info: "#6b7886", post: "#6b7886", theater: "#d9559b",
  general: "#2f80d8", butcher: "#2f80d8", trapper: "#2f80d8", gun: "#2f80d8"
};

function iconUri(i, v) {
  const og = v.s === "-g" ? GTA_G[i.key] : null;
  let disc = null, fill = "white", ring = "";
  if (v.s === "") disc = i.dim ? "#bdbdbd" : "#000000";
  else if (v.s === "-f") { disc = FORT_COL[i.key] || "#2f80d8"; ring = ` stroke="white" stroke-width="3"`; }
  else fill = (og && og.col) || GTA_COL[i.key] || "white";
  const hole = disc || "#2b2b2b";
  const src = og ? og.g : i.g;
  const body = src.split("BG").join(hole).split('stroke="white"').join('stroke="' + fill + '"');
  const bg = disc ? `<circle cx="32" cy="32" r="${ring ? 29 : 31}" fill="${disc}"${ring}/>` : "";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">` +
    `${bg}<g fill="${fill}">${body}</g></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

// Safari can't use SVG images directly as map icons, so draw each one onto a canvas first
const iconData = {};
function loadIcons() {
  const jobs = [];
  ICONS.forEach(i => VARIANTS.forEach(v => jobs.push(new Promise(res => {
    const im = new Image(64, 64);
    im.onload = () => {
      try {
        const c = document.createElement("canvas");
        c.width = 128; c.height = 128;
        const ctx = c.getContext("2d");
        ctx.drawImage(im, 0, 0, 128, 128);
        iconData[i.key + v.s] = ctx.getImageData(0, 0, 128, 128);
      } catch (e) {}
      res();
    };
    im.onerror = () => res();
    im.src = iconUri(i, v);
  }))));
  return Promise.all(jobs);
}

const ALL_SUBS = ICONS.flatMap(i => i.subs);
const ICON_MATCH = ["match", ["get", "subclass"]];
ICONS.forEach(i => ICON_MATCH.push(i.subs, i.key));
ICON_MATCH.push(["match", ["get", "class"], ["restaurant", "fast_food"], "food", ["cafe", "bakery", "ice_cream"], "cafe", "general"]);

function poiLayer(t, textColor, haloColor) {
  return {
    id: "poi", type: "symbol", source: "omt", "source-layer": "poi", minzoom: 14,
    filter: ["any",
      ["in", ["get", "subclass"], ["literal", ALL_SUBS]],
      ["in", ["get", "class"], ["literal", ["shop", "grocery", "restaurant", "fast_food", "cafe", "bakery", "ice_cream"]]]
    ],
    layout: {
      "icon-image": t.iconSuffix ? ["concat", ICON_MATCH, t.iconSuffix] : ICON_MATCH,
      "icon-size": t.iconSize || 0.55, "icon-padding": 4, "icon-allow-overlap": false,
      "symbol-sort-key": ["coalesce", ["get", "rank"], 99],
      "text-field": ["get", "name"], "text-font": [t.font], "text-size": 11 * (t.ts || 1),
      "text-anchor": "top", "text-offset": [0, 1.2], "text-optional": true, "text-max-width": 7
    },
    paint: { "text-color": textColor, "text-halo-color": haloColor, "text-halo-width": 1.3 }
  };
}

// ---------- Themes ----------
const GRID_BG =
  "linear-gradient(to right, rgba(255,255,255,.28) 1px, transparent 1px) 0 0 / 12.5% 100%," +
  "linear-gradient(to bottom, rgba(255,255,255,.28) 1px, transparent 1px) 0 0 / 100% 12.5%";

const THEMES = {
  gta: {
    label: "GTA V",
    land: "#303030", green: "#363d33", park: "#363d33", water: "#0b0b0b",
    lu: { residential: "#3b3b3b", commercial: "#474747", retail: "#474747", industrial: "#2a2a2a",
          hospital: "#444444", school: "#404040", university: "#404040", cemetery: "#343c31",
          stadium: "#3a4636", pitch: "#343c31", playground: "#343c31", railway: "#2a2a2a" },
    building: "#4d4d4d", buildingEdge: "#262626",
    roadCase: "#1c1c1c", road: "#c9c9c9", major: "#f1f1f1", rw: 1.9,
    text: "#e9e9e9", halo: "#161616", font: "Noto Sans Bold",
    iconSuffix: "-g", iconSize: 0.7,
    route: "#d46bd9", routeCase: "#1a1a1a", pin: "#ff4d4d",
    fx: "none"
  },
  rdr2: {
    label: "RDR2",
    kind: "rdr2",
    land: "#dcae7c", park: "#d6a874", green: "#d8a975", marsh: "#b5ad92",
    water: "#a29f8a", waterEdge: "#6f6c5b", waterRing: "#8d8a76",
    building: "#cf9f6e", buildingEdge: "#5a5046",
    ink: "#4a443d", waterText: "#7d7a66", font: "Noto Sans Bold",
    route: "#9b2c2c", routeCase: "#3a2a18", pin: "#9b2c2c",
    fx: "radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(70,55,35,.25) 100%)," +
        "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .17  0 0 0 0 .1  0 0 0 .3 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>\")"
  },
  fn: {
    label: "Fortnite",
    land: "#6db33f", green: "#6db33f", park: "#5fa636", water: "#1d79bd",
    cv: { grass: "#6db33f", wood: "#4a8f2c", farmland: "#d9b53a", sand: "#eadfb4",
          rock: "#8f9d78", wetland: "#3e7b48", ice: "#f6fafc" },
    lu: { residential: "#b8c2a6", commercial: "#c9cbc1", retail: "#c9cbc1", industrial: "#9c9d93",
          hospital: "#c9cbc1", school: "#b8c2a6", university: "#b8c2a6", cemetery: "#5d9a38",
          stadium: "#76b843", pitch: "#7cbc47", playground: "#7cbc47", railway: "#9c9d93",
          quarry: "#8f9d78", military: "#7a9a62" },
    building: "#b4b7aa", buildingEdge: "#7c8073",
    roadCase: "#8a7a5e", road: "#cdbb97", major: "#dccba6", rw: 0.7, ww: 6,
    text: "#ffffff", halo: "#16324a", ts: 1.15, font: "Noto Sans Bold",
    iconSuffix: "-f", iconSize: 0.55,
    route: "#ffe14d", routeCase: "#16324a", pin: "#ff4fa3",
    grid: true,
    fx: GRID_BG
  }
};

const SOURCES = { omt: { type: "vector", url: "https://tiles.openfreemap.org/planet" } };
const GLYPHS = "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf";
const wz = (a, b) => ["interpolate", ["exponential", 1.5], ["zoom"], 8, a, 14, b, 20, b * 6];

function matchExpr(prop, obj, fallback) {
  const keys = Object.keys(obj || {});
  if (!keys.length) return fallback;
  const e = ["match", ["get", prop]];
  keys.forEach(k => e.push(k, obj[k]));
  e.push(fallback);
  return e;
}

function makeStyle(t) {
  if (t.kind === "rdr2") return makeRdr2Style(t);
  const classes = ["in", "class", "motorway", "trunk", "primary", "secondary", "tertiary", "minor", "service"];
  const rw = t.rw || 1, ts = t.ts || 1;
  return {
    version: 8, glyphs: GLYPHS, sources: SOURCES,
    layers: [
      { id: "bg", type: "background", paint: { "background-color": t.land } },
      { id: "cover", type: "fill", source: "omt", "source-layer": "landcover",
        paint: { "fill-color": matchExpr("class", t.cv, t.green) } },
      { id: "landuse", type: "fill", source: "omt", "source-layer": "landuse",
        paint: { "fill-color": matchExpr("class", t.lu, "rgba(0,0,0,0)") } },
      { id: "park", type: "fill", source: "omt", "source-layer": "park", paint: { "fill-color": t.park } },
      { id: "water", type: "fill", source: "omt", "source-layer": "water", paint: { "fill-color": t.water } },
      { id: "waterway", type: "line", source: "omt", "source-layer": "waterway",
        paint: { "line-color": t.water, "line-width": wz(0.8, t.ww || 3) } },
      { id: "building", type: "fill", source: "omt", "source-layer": "building", minzoom: 14,
        paint: { "fill-color": t.building, "fill-outline-color": t.buildingEdge || t.building } },
      { id: "road-case", type: "line", source: "omt", "source-layer": "transportation",
        filter: classes, layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": t.roadCase, "line-width": wz(1.2 * rw, 4 * rw) } },
      { id: "road", type: "line", source: "omt", "source-layer": "transportation",
        filter: classes, layout: { "line-cap": "round", "line-join": "round" },
        paint: {
          "line-color": ["match", ["get", "class"], ["motorway", "trunk", "primary"], t.major, t.road],
          "line-width": wz(0.7 * rw, 3 * rw)
        } },
      { id: "road-label", type: "symbol", source: "omt", "source-layer": "transportation_name", minzoom: 13,
        layout: { "symbol-placement": "line", "text-field": ["get", "name"], "text-font": [t.font], "text-size": 11 * ts },
        paint: { "text-color": t.text, "text-halo-color": t.halo, "text-halo-width": 1.5 } },
      poiLayer(t, t.text, t.halo),
      { id: "place", type: "symbol", source: "omt", "source-layer": "place",
        filter: ["in", "class", "city", "town", "village", "suburb"],
        layout: { "text-field": ["get", "name"], "text-font": [t.font], "text-size": 14 * ts, "text-transform": "uppercase" },
        paint: { "text-color": t.text, "text-halo-color": t.halo, "text-halo-width": 2 } }
    ]
  };
}

function makeRdr2Style(t) {
  const L = "transportation";
  const round = { "line-cap": "round", "line-join": "round" };
  const major = ["in", "class", "motorway", "trunk", "primary"];
  const mid = ["in", "class", "secondary", "tertiary"];
  const minor = ["in", "class", "minor", "service"];
  const ring = (id, off, op) => ({
    id, type: "line", source: "omt", "source-layer": "water",
    paint: { "line-color": t.waterRing, "line-width": 1, "line-offset": off, "line-opacity": op }
  });
  return {
    version: 8, glyphs: GLYPHS, sources: SOURCES,
    layers: [
      { id: "bg", type: "background", paint: { "background-color": t.land } },
      { id: "cover", type: "fill", source: "omt", "source-layer": "landcover",
        filter: ["in", "class", "grass", "wood", "farmland"], paint: { "fill-color": t.green } },
      { id: "marsh", type: "fill", source: "omt", "source-layer": "landcover",
        filter: ["==", "class", "wetland"], paint: { "fill-color": t.marsh } },
      { id: "park", type: "fill", source: "omt", "source-layer": "park", paint: { "fill-color": t.park } },
      { id: "water", type: "fill", source: "omt", "source-layer": "water", paint: { "fill-color": t.water } },
      ring("ring3", 19, 0.3), ring("ring2", 11, 0.45), ring("ring1", 5, 0.6),
      { id: "water-edge", type: "line", source: "omt", "source-layer": "water",
        paint: { "line-color": t.waterEdge, "line-width": 1.4 } },
      { id: "waterway", type: "line", source: "omt", "source-layer": "waterway",
        paint: { "line-color": t.waterEdge, "line-width": wz(0.6, 2) } },
      { id: "building", type: "fill", source: "omt", "source-layer": "building", minzoom: 13,
        paint: { "fill-color": t.building, "fill-outline-color": t.buildingEdge } },
      { id: "rail", type: "line", source: "omt", "source-layer": L, filter: ["==", "class", "rail"],
        paint: { "line-color": t.ink, "line-width": wz(1.2, 3.5) } },
      { id: "rail-ties", type: "line", source: "omt", "source-layer": L, filter: ["==", "class", "rail"],
        paint: { "line-color": t.land, "line-width": wz(0.6, 1.6), "line-dasharray": [1.5, 2.5] } },
      { id: "case-minor", type: "line", source: "omt", "source-layer": L, filter: minor, layout: round,
        paint: { "line-color": t.ink, "line-width": wz(0.8, 2.2) } },
      { id: "case-mid", type: "line", source: "omt", "source-layer": L, filter: mid, layout: round,
        paint: { "line-color": t.ink, "line-width": wz(1.2, 4.5) } },
      { id: "case-major", type: "line", source: "omt", "source-layer": L, filter: major, layout: round,
        paint: { "line-color": t.ink, "line-width": wz(1.8, 6.5) } },
      { id: "inner-mid", type: "line", source: "omt", "source-layer": L, filter: mid, minzoom: 13, layout: round,
        paint: { "line-color": t.land, "line-width": wz(0.3, 1.6) } },
      { id: "inner-major", type: "line", source: "omt", "source-layer": L, filter: major, minzoom: 12, layout: round,
        paint: { "line-color": t.land, "line-width": wz(0.4, 2.4) } },
      { id: "road-label", type: "symbol", source: "omt", "source-layer": "transportation_name", minzoom: 14,
        layout: { "symbol-placement": "line", "text-field": ["get", "name"], "text-font": [t.font], "text-size": 11,
                  "text-letter-spacing": 0.1 },
        paint: { "text-color": t.ink, "text-halo-color": t.land, "text-halo-width": 1.5 } },
      { id: "water-name", type: "symbol", source: "omt", "source-layer": "water_name",
        layout: { "text-field": ["get", "name"], "text-font": [t.font], "text-transform": "uppercase",
                  "text-letter-spacing": 0.5, "text-max-width": 6,
                  "text-size": ["interpolate", ["linear"], ["zoom"], 8, 14, 14, 30] },
        paint: { "text-color": t.waterText } },
      poiLayer(t, t.ink, t.land),
      { id: "place", type: "symbol", source: "omt", "source-layer": "place",
        filter: ["in", "class", "city", "town", "village", "suburb"],
        layout: { "text-field": ["get", "name"], "text-font": [t.font], "text-transform": "uppercase",
                  "text-letter-spacing": 0.15, "text-max-width": 8,
                  "text-size": ["interpolate", ["linear"], ["zoom"], 6, 12, 12, 24, 16, 38] },
        paint: { "text-color": t.ink, "text-halo-width": 0 } }
    ]
  };
}

// ---------- Directions helpers ----------
const EMPTY_FC = { type: "FeatureCollection", features: [] };
let ROUTE_FC = EMPTY_FC;
let PIN_FC = EMPTY_FC;

// Free public routing (OpenStreetMap-based). Car, bike and foot profiles.
const PROFILES = { car: "routed-car", bike: "routed-bike", foot: "routed-foot" };
async function fetchRoute(from, to, mode) {
  const coords = from[0] + "," + from[1] + ";" + to[0] + "," + to[1];
  const q = "?overview=full&geometries=geojson&steps=true";
  const urls = ["https://routing.openstreetmap.de/" + PROFILES[mode] + "/route/v1/driving/" + coords + q];
  if (mode === "car") urls.push("https://router.project-osrm.org/route/v1/driving/" + coords + q);
  let lastErr = "no route found";
  for (const u of urls) {
    try {
      const r = await fetch(u);
      const j = await r.json();
      if (j.code === "Ok" && j.routes && j.routes.length) return j.routes[0];
      lastErr = j.message || j.code || "no route found";
    } catch (e) { lastErr = e.message || "network error"; }
  }
  throw new Error(lastErr);
}

function fmtDist(m) {
  const mi = m / 1609.344;
  if (mi < 0.1) return Math.max(10, Math.round(m * 3.281 / 10) * 10) + " ft";
  return (mi < 10 ? mi.toFixed(1) : Math.round(mi)) + " mi";
}
function fmtDur(s) {
  const m = Math.round(s / 60);
  if (m < 60) return Math.max(1, m) + " min";
  return Math.floor(m / 60) + " h " + (m % 60) + " min";
}
const ARROWS = { "left": "\u2190", "right": "\u2192", "slight left": "\u2196", "slight right": "\u2197",
                 "sharp left": "\u2199", "sharp right": "\u2198", "straight": "\u2191", "uturn": "\u21A9" };
function stepInfo(s) {
  const m = s.maneuver || {};
  const mod = m.modifier || "";
  const road = s.name ? " onto " + s.name : "";
  const on = s.name ? " on " + s.name : "";
  let text = "Continue" + road, arrow = ARROWS[mod] || "\u2191";
  switch (m.type) {
    case "depart": {
      const dirs = ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"];
      text = "Head " + (m.bearing_after != null ? dirs[Math.round(m.bearing_after / 45) % 8] : "out") + on;
      arrow = "\u2191"; break;
    }
    case "arrive": text = "Arrive at your destination" + (mod && mod !== "straight" ? " on the " + mod : ""); arrow = "\u2691"; break;
    case "turn": text = "Turn " + mod + road; break;
    case "end of road": text = "At the end of the road turn " + mod + road; break;
    case "merge": text = "Merge" + (mod ? " " + mod : "") + road; break;
    case "on ramp": text = "Take the ramp" + road; break;
    case "off ramp": text = "Take the exit" + road; break;
    case "fork": text = "Keep " + (mod || "straight") + " at the fork" + road; break;
    case "roundabout": case "rotary": text = "Enter the roundabout" + (m.exit ? ", take exit " + m.exit : "") + road; arrow = "\u21BB"; break;
    case "roundabout turn": text = "At the roundabout turn " + mod + road; break;
    case "continue": text = "Continue " + (mod || "straight") + on; break;
    default: text = "Continue" + road;
  }
  return { text, arrow };
}
function pretty(s) {
  s = String(s || "").replace(/_/g, " ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// ---------- App ----------
let curTheme = THEMES.rdr2;

loadIcons().then(() => {
  const map = new maplibregl.Map({
    container: "map",
    style: makeStyle(curTheme),
    center: [-121.9886, 37.5485], // Fremont, CA; GPS will take over
    zoom: 15
  });
  const badge = document.getElementById("badge");

  // Hand each icon to the map the moment a style asks for it
  map.on("styleimagemissing", e => {
    const d = iconData[e.id];
    if (d && !map.hasImage(e.id)) map.addImage(e.id, d, { pixelRatio: 2 });
  });

  // The route line and destination pin are added after every style load (theme switches wipe them)
  function addDirectionLayers() {
    const t = curTheme;
    try {
      if (!map.getSource("route")) map.addSource("route", { type: "geojson", data: ROUTE_FC });
      if (!map.getSource("pin")) map.addSource("pin", { type: "geojson", data: PIN_FC });
      const lay = { "line-cap": "round", "line-join": "round" };
      if (!map.getLayer("route-case")) map.addLayer({ id: "route-case", type: "line", source: "route", layout: lay,
        paint: { "line-color": t.routeCase, "line-width": 10, "line-opacity": 0.6 } });
      if (!map.getLayer("route")) map.addLayer({ id: "route", type: "line", source: "route", layout: lay,
        paint: { "line-color": t.route, "line-width": 5.5 } });
      if (!map.getLayer("pin")) map.addLayer({ id: "pin", type: "circle", source: "pin",
        paint: { "circle-radius": 9, "circle-color": t.pin, "circle-stroke-width": 3, "circle-stroke-color": "#ffffff" } });
    } catch (e) { badge.textContent = "layer error: " + e.message; }
  }
  map.on("style.load", addDirectionLayers);

  map.addControl(new maplibregl.NavigationControl({ showCompass: true }), "top-right");
  const geo = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true, showUserHeading: true
  });
  map.addControl(geo, "top-right");
  map.on("load", () => geo.trigger());

  let userPos = null;
  geo.on("geolocate", e => { userPos = [e.coords.longitude, e.coords.latitude]; });
  function getUserPos() {
    return new Promise((res, rej) => {
      if (userPos) return res(userPos);
      if (!navigator.geolocation) return rej(new Error("location not available"));
      navigator.geolocation.getCurrentPosition(
        p => { userPos = [p.coords.longitude, p.coords.latitude]; res(userPos); },
        () => rej(new Error("allow location access, or type a start point")),
        { enableHighAccuracy: true, timeout: 10000 });
    });
  }

  // Badge: zoom level, places on screen, and any map error
  function updateBadge() {
    const z = map.getZoom();
    let n = 0;
    try { if (map.getLayer("poi")) n = map.queryRenderedFeatures({ layers: ["poi"] }).length; } catch (e) {}
    badge.textContent = "zoom " + z.toFixed(1) + (z < 14 ? " (zoom in for places)" : " | places: " + n);
  }
  map.on("idle", updateBadge);
  map.on("zoomend", updateBadge);
  map.on("error", e => {
    badge.textContent = "map error: " + String((e.error && e.error.message) || "unknown").slice(0, 120);
  });

  // ----- Search (free OpenStreetMap-based place search) -----
  function attachSearch(input, list, onPick) {
    let timer = null, ctrl = null;
    input.addEventListener("input", () => {
      clearTimeout(timer);
      const v = input.value.trim();
      if (v.length < 3) { list.innerHTML = ""; return; }
      timer = setTimeout(async () => {
        if (ctrl) ctrl.abort();
        ctrl = new AbortController();
        try {
          const c = map.getCenter();
          const url = "https://photon.komoot.io/api/?limit=6&lat=" + c.lat + "&lon=" + c.lng + "&q=" + encodeURIComponent(v);
          const r = await fetch(url, { signal: ctrl.signal });
          const j = await r.json();
          list.innerHTML = "";
          (j.features || []).forEach(f => {
            const p = f.properties || {};
            const street = [p.housenumber, p.street].filter(Boolean).join(" ");
            const title = p.name || street || p.city || "Unnamed place";
            const sub = [(p.name && street) ? street : "", p.city, p.state, p.country].filter(Boolean).join(", ");
            const d = document.createElement("div");
            const a = document.createElement("b"); a.textContent = title;
            const b = document.createElement("div"); b.className = "ss"; b.textContent = sub;
            d.appendChild(a); d.appendChild(b);
            d.onclick = () => { list.innerHTML = ""; input.value = title; input.blur();
              onPick({ name: title, sub: sub, lngLat: f.geometry.coordinates }); };
            list.appendChild(d);
          });
          if (!list.children.length) list.textContent = "No results";
        } catch (e) { if (e.name !== "AbortError") list.textContent = "Search unavailable right now"; }
      }, 350);
    });
  }

  // ----- Sheet: place card + directions -----
  const $ = id => document.getElementById(id);
  const sheet = $("sheet"), placeEl = $("place"), dirEl = $("dir");
  const dfrom = $("dfrom"), dto = $("dto"), sum = $("sum"), stepsEl = $("steps");
  let cand = null, dest = null, from = null, mode = "car", dirOpen = false;

  function setPin(ll) {
    PIN_FC = ll ? { type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: ll } }] } : EMPTY_FC;
    const s = map.getSource("pin"); if (s) s.setData(PIN_FC);
  }
  function setRoute(geom) {
    ROUTE_FC = geom ? { type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: geom }] } : EMPTY_FC;
    const s = map.getSource("route"); if (s) s.setData(ROUTE_FC);
  }

  function showPlace(p, fly) {
    cand = p; dirOpen = false;
    $("pname").textContent = p.name;
    $("psub").textContent = p.sub || "";
    setPin(p.lngLat); setRoute(null);
    if (fly) map.flyTo({ center: p.lngLat, zoom: Math.max(map.getZoom(), 16) });
    placeEl.style.display = "block"; dirEl.style.display = "none"; sheet.style.display = "block";
  }
  function hideSheet() {
    sheet.style.display = "none"; placeEl.style.display = "none"; dirEl.style.display = "none";
    dirOpen = false; setPin(null); setRoute(null);
  }

  async function computeRoute() {
    if (!dest) return;
    sum.textContent = "Finding route...";
    stepsEl.innerHTML = "";
    setRoute(null);
    try {
      const start = from ? from.lngLat : await getUserPos();
      const r = await fetchRoute(start, dest.lngLat, mode);
      setRoute(r.geometry);
      const b = new maplibregl.LngLatBounds();
      r.geometry.coordinates.forEach(c => b.extend(c));
      const bottom = Math.min(360, Math.round(window.innerHeight * 0.5));
      map.fitBounds(b, { padding: { top: 90, bottom: bottom, left: 40, right: 40 }, maxZoom: 17 });
      sum.textContent = fmtDur(r.duration) + " \u00B7 " + fmtDist(r.distance);
      (r.legs || []).forEach(leg => (leg.steps || []).forEach(s => {
        const info = stepInfo(s);
        const li = document.createElement("li");
        const ar = document.createElement("span"); ar.className = "ar"; ar.textContent = info.arrow;
        const tx = document.createElement("span"); tx.className = "tx"; tx.textContent = info.text;
        const ds = document.createElement("span"); ds.className = "ds";
        ds.textContent = (s.maneuver && s.maneuver.type === "arrive") ? "" : fmtDist(s.distance);
        li.appendChild(ar); li.appendChild(tx); li.appendChild(ds);
        li.onclick = () => { if (s.maneuver && s.maneuver.location) map.flyTo({ center: s.maneuver.location, zoom: 17 }); };
        stepsEl.appendChild(li);
      }));
    } catch (e) {
      sum.textContent = "Couldn't get directions: " + e.message;
    }
  }

  function openDirections() {
    dest = cand; from = null; dirOpen = true;
    dfrom.value = ""; dto.value = cand.name;
    placeEl.style.display = "none"; dirEl.style.display = "block";
    computeRoute();
  }

  $("pdir").onclick = openDirections;
  $("pclose").onclick = hideSheet;
  $("dclose").onclick = () => { if (dest) showPlace(dest, false); else hideSheet(); };
  [...document.querySelectorAll("#modes button")].forEach(b => {
    b.onclick = () => {
      mode = b.dataset.m;
      [...document.querySelectorAll("#modes button")].forEach(x => x.classList.toggle("on", x === b));
      computeRoute();
    };
  });

  attachSearch($("q"), $("sugs"), p => showPlace(p, true));
  attachSearch(dfrom, $("sf"), p => { from = p; computeRoute(); });
  attachSearch(dto, $("st"), p => { dest = p; cand = p; setPin(p.lngLat); computeRoute(); });
  dfrom.addEventListener("input", () => { if (!dfrom.value.trim()) { from = null; $("sf").innerHTML = ""; } });
  dfrom.addEventListener("change", () => { if (!dfrom.value.trim()) { from = null; computeRoute(); } });

  // Tap a place icon or any spot on the map to get a place card
  map.on("click", e => {
    if (dirOpen) return;
    let fs = [];
    try {
      if (map.getLayer("poi")) {
        const box = [[e.point.x - 14, e.point.y - 14], [e.point.x + 14, e.point.y + 14]];
        fs = map.queryRenderedFeatures(box, { layers: ["poi"] });
      }
    } catch (err) {}
    if (fs.length) {
      const f = fs[0], p = f.properties || {};
      showPlace({ name: p.name || pretty(p.subclass), sub: pretty(p.subclass), lngLat: f.geometry.coordinates }, false);
    } else {
      const ll = [e.lngLat.lng, e.lngLat.lat];
      showPlace({ name: "Dropped pin", sub: ll[1].toFixed(5) + ", " + ll[0].toFixed(5), lngLat: ll }, false);
    }
  });

  // Fortnite-style grid labels: letters A-H across the top, numbers 1-8 down the left
  const gridEl = $("grid");
  "ABCDEFGH".split("").forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "gt"; s.textContent = c; s.style.left = (i * 12.5 + 6.25) + "%";
    gridEl.appendChild(s);
  });
  for (let n = 1; n <= 8; n++) {
    const s = document.createElement("span");
    s.className = "gl"; s.textContent = n; s.style.top = ((n - 1) * 12.5 + 6.25) + "%";
    gridEl.appendChild(s);
  }

  const bar = $("themes");
  const fx = $("fx");
  function setTheme(key) {
    const t = THEMES[key];
    curTheme = t;
    // diff:false = replace the whole style, so switching themes can't half-fail
    map.setStyle(makeStyle(t), { diff: false });
    fx.style.background = t.fx;
    gridEl.style.display = t.grid ? "block" : "none";
    [...bar.children].forEach(b => b.classList.toggle("on", b.dataset.k === key));
  }
  Object.entries(THEMES).forEach(([k, t]) => {
    const b = document.createElement("button");
    b.textContent = t.label; b.dataset.k = k;
    b.onclick = () => setTheme(k);
    bar.appendChild(b);
  });
  setTheme("rdr2");
});
</script>
</body>
</html>
